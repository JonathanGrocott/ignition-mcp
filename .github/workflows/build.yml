name: Build

on:
  push:
    branches: [ main, master, develop, dev/designer-assistant ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build module
      run: ./gradlew clean test :zipModule checksumModl :designer-assistant:zipModule

    - name: Sign module
      run: ./scripts/sign-module.sh

    - name: Prepare checksum file
      run: |
        unzip -l build/ignition-mcp.modl | grep -q "certificates.p7b"
        unzip -l build/ignition-mcp.modl | grep -q "signatures.properties"
        sha256sum build/ignition-mcp.modl > build/ignition-mcp.modl.sha256

    - name: Upload module artifact
      uses: actions/upload-artifact@v4
      with:
        name: ignition-mcp-module
        path: |
          build/ignition-mcp.modl
          build/ignition-mcp.modl.sha256
          build/checksum/checksum.json
        retention-days: 30

    - name: Sign Designer Assistant
      env:
        MODULE_IN: designer-assistant/build/ignition-designer-assistant.unsigned.modl
        MODULE_OUT: designer-assistant/build/ignition-designer-assistant.modl
      run: |
        ./scripts/sign-module.sh
        sha256sum "${MODULE_OUT}" > "${MODULE_OUT}.sha256"

    - name: Upload Designer Assistant artifact
      uses: actions/upload-artifact@v4
      with:
        name: ignition-designer-assistant-module
        path: |
          designer-assistant/build/ignition-designer-assistant.modl
          designer-assistant/build/ignition-designer-assistant.modl.sha256
        retention-days: 30
