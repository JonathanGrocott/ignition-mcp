name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build module
      run: ./gradlew clean test zipModule checksumModl

    - name: Test Gateway UI state
      run: node --test gateway/src/test/js/*.test.cjs

    - name: Sign module
      run: ./scripts/sign-module.sh

    - name: Get version from build.gradle.kts
      id: get_version
      run: |
        VERSION=$(grep "moduleVersion = " build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Module version: $VERSION"

    - name: Verify tag matches module version
      if: github.ref_type == 'tag'
      run: |
        EXPECTED_TAG="v$VERSION"
        if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
          echo "Tag $GITHUB_REF_NAME does not match module version $VERSION; expected $EXPECTED_TAG" >&2
          exit 1
        fi

    - name: Find .modl file
      id: find_modl
      run: |
        MODL_FILE=$(find build -name "*.modl" ! -name "*.unsigned.modl" -type f | head -1)
        if [ -z "$MODL_FILE" ]; then
          echo "No signed .modl file found"
          exit 1
        fi
        unzip -l "$MODL_FILE" | grep -q "certificates.p7b"
        unzip -l "$MODL_FILE" | grep -q "signatures.properties"
        SHA_FILE="${MODL_FILE}.sha256"
        sha256sum "$MODL_FILE" > "$SHA_FILE"
        echo "MODL_FILE=$MODL_FILE" >> $GITHUB_ENV
        echo "SHA_FILE=$SHA_FILE" >> $GITHUB_ENV
        echo "Found module file: $MODL_FILE"
        echo "Generated checksum file: $SHA_FILE"

    - name: Check for an existing release
      id: existing_release
      uses: actions/github-script@v7
      with:
        script: |
          const tag = `v${process.env.VERSION}`;
          try {
            await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            core.setOutput('exists', 'true');
            core.info(`Preserving existing release ${tag} and its accepted assets.`);
          } catch (error) {
            if (error.status !== 404) throw error;
            core.setOutput('exists', 'false');
          }

    - name: Create Release
      if: steps.existing_release.outputs.exists != 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'SNAPSHOT') }}
        body: |
          ## Ignition MCP Module
          Version: ${{ env.VERSION }}

          ### Installation
          1. Download the signed `.modl` file below
          2. Install it through `Platform > System > Modules`
          3. Review the signing certificate and follow Ignition's prompts
          4. Open `Services > Ignition MCP > Configuration` and begin with Read-only and Profiles only

          ### Verification
          - Gateway UI page: `Services > Ignition MCP > Configuration`
          - MCP endpoint: `/data/ignition-mcp/mcp`

          ### Changes
          See the [changelog](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) and [illustrated User Guide](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs/USER_GUIDE.md).
        files: |
          ${{ env.MODL_FILE }}
          ${{ env.SHA_FILE }}
