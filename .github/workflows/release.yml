name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_SIGNER_SHA256: '63:3C:42:A8:2E:98:01:A0:3C:3D:A9:98:82:BB:E3:7A:8E:5E:49:15:11:51:3F:BB:C6:6A:1E:B7:86:58:C6:2A'

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      gateway-version: ${{ steps.versions.outputs.gateway }}
      designer-version: ${{ steps.versions.outputs.designer }}
      designer-sdk: ${{ steps.versions.outputs.designer_sdk }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag and module versions
        id: versions
        run: |
          gateway=$(sed -n 's/^val moduleVersion = "\([^"]*\)"$/\1/p' build.gradle.kts)
          designer=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' designer-assistant/build.gradle.kts)
          designer_sdk=$(sed -n 's/^val designerSdkVersion = "\([^"]*\)"$/\1/p' designer-assistant/build.gradle.kts)
          [[ "$gateway" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$designer" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$designer_sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_NAME" != "v$gateway" ]]; then
            echo "Tag does not match the Gateway module version; expected v$gateway." >&2
            exit 1
          fi
          printf 'gateway=%s\ndesigner=%s\ndesigner_sdk=%s\n' "$gateway" "$designer" "$designer_sdk" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test both modules
        run: |
          ./gradlew --no-daemon clean test :zipModule checksumModl :designer-assistant:zipModule
          node --test gateway/src/test/js/*.test.cjs
          mkdir release-input
          cp build/ignition-mcp.unsigned.modl designer-assistant/build/ignition-designer-assistant.unsigned.modl release-input/

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-inputs
          path: release-input/*.unsigned.modl
          if-no-files-found: error
          retention-days: 1

  sign-and-stage:
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    env:
      GATEWAY_VERSION: ${{ needs.build.outputs.gateway-version }}
      DESIGNER_VERSION: ${{ needs.build.outputs.designer-version }}
      DESIGNER_SDK: ${{ needs.build.outputs.designer-sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release-inputs
          path: release-input

      - name: Sign and verify both modules
        env:
          MODULE_SIGNING_KEYSTORE_BASE64: ${{ secrets.MODULE_SIGNING_KEYSTORE_BASE64 }}
          MODULE_SIGNING_CHAIN_BASE64: ${{ secrets.MODULE_SIGNING_CHAIN_BASE64 }}
          MODULE_SIGNING_ALIAS: ${{ secrets.MODULE_SIGNING_ALIAS }}
          MODULE_SIGNING_PASSWORD: ${{ secrets.MODULE_SIGNING_PASSWORD }}
        run: |
          : "${MODULE_SIGNING_KEYSTORE_BASE64:?Missing release keystore}"
          : "${MODULE_SIGNING_CHAIN_BASE64:?Missing release certificate chain}"
          : "${MODULE_SIGNING_ALIAS:?Missing release key alias}"
          : "${MODULE_SIGNING_PASSWORD:?Missing release key password}"
          umask 077
          signing_dir=$(mktemp -d)
          trap 'rm -rf -- "$signing_dir"' EXIT
          export MODULE_SIGNING_KEYSTORE="$signing_dir/release.p12"
          export MODULE_SIGNING_CHAIN="$signing_dir/release.p7b"
          printf '%s' "$MODULE_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$MODULE_SIGNING_KEYSTORE"
          printf '%s' "$MODULE_SIGNING_CHAIN_BASE64" | base64 --decode > "$MODULE_SIGNING_CHAIN"
          test -s "$MODULE_SIGNING_KEYSTORE"
          test -s "$MODULE_SIGNING_CHAIN"
          mkdir release-assets

          for name in ignition-mcp ignition-designer-assistant; do
            MODULE_IN="$PWD/release-input/$name.unsigned.modl" \
              MODULE_OUT="$PWD/release-assets/$name.modl" ./scripts/sign-module.sh
          done

          python3 scripts/verify-signed-module.py release-assets/ignition-mcp.modl \
            --module-id com.jg.ignition.mcp --version "$GATEWAY_VERSION" --fingerprint "$RELEASE_SIGNER_SHA256" \
            --unsigned release-input/ignition-mcp.unsigned.modl
          python3 scripts/verify-signed-module.py release-assets/ignition-designer-assistant.modl \
            --module-id com.jg.ignition.designerassistant --version "$DESIGNER_VERSION" --fingerprint "$RELEASE_SIGNER_SHA256" \
            --unsigned release-input/ignition-designer-assistant.unsigned.modl
          cd release-assets
          for module in *.modl; do
            sha256sum "$module" > "$module.sha256"
            sha256sum -c "$module.sha256"
          done

      - name: Stage GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url >/dev/null 2>&1; then
            echo "An existing release or draft already uses $GITHUB_REF_NAME. Preserving its assets." >&2
            exit 1
          fi
          docs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
          {
            printf 'Install Ignition MCP **%s** for Gateway tools and external MCP clients.\n\n' "$GATEWAY_VERSION"
            printf 'For docked chat in Ignition Designer **%s**, install **both** Ignition MCP **%s** and Designer Assistant **%s** on the same Gateway.\n\n' "$DESIGNER_SDK" "$GATEWAY_VERSION" "$DESIGNER_VERSION"
            printf 'Verify each module against its accompanying SHA-256 file. The signing certificate SHA-256 fingerprint is `%s`.\n\n' "$RELEASE_SIGNER_SHA256"
            printf '[Designer Assistant setup](%s/docs/DESIGNER_ASSISTANT.md) · [Gateway setup](%s/docs/USER_GUIDE.md) · [Changelog](%s/CHANGELOG.md)\n' "$docs" "$docs" "$docs"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Ignition MCP $GATEWAY_VERSION and Designer Assistant $DESIGNER_VERSION" \
            --notes-file release-notes.md release-assets/ignition-mcp.modl release-assets/ignition-mcp.modl.sha256 \
            release-assets/ignition-designer-assistant.modl release-assets/ignition-designer-assistant.modl.sha256
